<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my compression</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<main class="page">
    <header class="hero">
        <p class="brand">my compression</p>
        <h1>Pack it. Unpack it. Keep every byte.</h1>
        <p class="lead">Lossless ZIP, TAR.GZ, ZSTD and TAR.XZ. Drop a file, pick a format, download the result.</p>
    </header>

    <form id="compress-form" class="panel" enctype="multipart/form-data">
        <label class="drop" id="drop-zone">
            <input id="file-input" type="file" name="file" required />
            <span class="drop__title" id="file-label">Drop a file here</span>
            <span class="drop__hint">or click to browse</span>
        </label>

        <fieldset class="seg">
            <legend>Action</legend>
            <label class="seg__opt"><input type="radio" name="action" value="archive" checked /> Archive</label>
            <label class="seg__opt"><input type="radio" name="action" value="extract" /> Unpack</label>
        </fieldset>

        <fieldset class="formats">
            <legend>Format</legend>
            <label class="chip"><input type="radio" name="format" value="zip" checked /> <span>ZIP</span><small>classic</small></label>
            <label class="chip"><input type="radio" name="format" value="tar.gz" /> <span>TAR.GZ</span><small>unix</small></label>
            <label class="chip"><input type="radio" name="format" value="zstd" /> <span>ZSTD</span><small>fastest+</small></label>
            <label class="chip"><input type="radio" name="format" value="tar.xz" /> <span>TAR.XZ</span><small>smallest</small></label>
            <label class="chip chip--extract" data-extract-only><input type="radio" name="format" value="7z" /> <span>7Z</span><small>unpack only</small></label>
        </fieldset>

        <div class="actions">
            <button type="submit">Run</button>
        </div>
    </form>

    <section class="panel status" aria-live="polite">
        <h2>Status</h2>
        <p id="status-text">Waiting for a file…</p>
        <div class="progress" hidden>
            <div id="progress-bar" class="progress__bar"></div>
        </div>
        <dl class="sizes">
            <div><dt>Before</dt><dd id="size-before">—</dd></div>
            <div><dt>After</dt><dd id="size-after">—</dd></div>
        </dl>
        <a id="download-link" class="download" hidden href="#">Download result</a>
    </section>
</main>

<script>
    const form = document.getElementById('compress-form');
    const fileInput = document.getElementById('file-input');
    const fileLabel = document.getElementById('file-label');
    const dropZone = document.getElementById('drop-zone');
    const statusText = document.getElementById('status-text');
    const progressWrap = document.querySelector('.progress');
    const progressBar = document.getElementById('progress-bar');
    const sizeBefore = document.getElementById('size-before');
    const sizeAfter = document.getElementById('size-after');
    const downloadLink = document.getElementById('download-link');
    const submitBtn = form.querySelector('button[type="submit"]');

    const EXT_FORMAT = {
        '.zip': 'zip',
        '.tar.gz': 'tar.gz',
        '.tgz': 'tar.gz',
        '.zst': 'zstd',
        '.zstd': 'zstd',
        '.7z': '7z',
        '.tar.xz': 'tar.xz',
        '.txz': 'tar.xz',
    };

    const ARCHIVE_ACCEPT = '.zip,.tar.gz,.tgz,.zst,.zstd,.7z,.tar.xz,.txz';

    const archiveExt = (name) => {
        const lower = (name || '').toLowerCase();
        return Object.keys(EXT_FORMAT).sort((a, b) => b.length - a.length).find((ext) => lower.endsWith(ext));
    };

    const isUnpack = () => form.querySelector('input[name="action"]:checked').value === 'extract';

    const clearFile = () => {
        fileInput.value = '';
        fileLabel.textContent = 'Drop a file here';
    };

    const setFileName = (name) => {
        fileLabel.textContent = name || 'Drop a file here';
        if (!name) return;
        const key = archiveExt(name);
        if (!key) return;
        const radio = form.querySelector(`input[name="format"][value="${EXT_FORMAT[key]}"]`);
        if (radio && !radio.disabled) radio.checked = true;
    };

    const takeFile = (file) => {
        if (!file) return;
        if (isUnpack() && !archiveExt(file.name)) {
            clearFile();
            statusText.textContent = 'Choose an archive: ZIP, TAR.GZ, ZSTD, TAR.XZ, or 7Z';
            return;
        }
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        setFileName(file.name);
    };

    const syncAction = () => {
        const unpack = isUnpack();
        const chip = form.querySelector('[data-extract-only] input');
        chip.disabled = !unpack;
        if (!unpack && chip.checked) {
            form.querySelector('input[name="format"][value="zstd"]').checked = true;
        }
        fileInput.accept = unpack ? ARCHIVE_ACCEPT : '';
        const current = fileInput.files[0];
        if (unpack && current && !archiveExt(current.name)) {
            clearFile();
            statusText.textContent = 'Choose an archive: ZIP, TAR.GZ, ZSTD, TAR.XZ, or 7Z';
        }
    };

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) {
            fileLabel.textContent = 'Drop a file here';
            return;
        }
        takeFile(file);
    });
    form.querySelectorAll('input[name="action"]').forEach((el) => el.addEventListener('change', syncAction));
    syncAction();

    ['dragenter', 'dragover'].forEach((ev) => {
        dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.add('is-over'); });
    });
    ['dragleave', 'drop'].forEach((ev) => {
        dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.remove('is-over'); });
    });
    dropZone.addEventListener('drop', (e) => {
        takeFile(e.dataTransfer.files[0]);
    });

    const fmtBytes = (n) => {
        if (n == null || n < 0) return '—';
        const u = ['B', 'KB', 'MB', 'GB'];
        let i = 0, v = n;
        while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
        return `${v.toFixed(i ? 1 : 0)} ${u[i]}`;
    };

    const renderJob = (job) => {
        statusText.textContent = job.status === 'failed'
            ? (job.error || job.message || 'error')
            : (job.message || job.status);
        progressWrap.hidden = false;
        progressBar.style.width = `${job.progress || 0}%`;
        sizeBefore.textContent = fmtBytes(job.original_size);
        sizeAfter.textContent = fmtBytes(job.result_size);
        if (job.status === 'done') {
            downloadLink.hidden = false;
            downloadLink.href = `/api/jobs/${job.id}/download`;
            downloadLink.setAttribute('download', job.download_name || 'result');
        } else {
            downloadLink.hidden = true;
        }
    };

    const poll = async (id) => {
        try {
            const res = await fetch(`/api/jobs/${id}`);
            if (!res.ok) throw new Error('failed to get status');
            const job = await res.json();
            renderJob(job);
            if (job.status === 'done' || job.status === 'failed') {
                submitBtn.disabled = false;
                return;
            }
            setTimeout(() => poll(id), 500);
        } catch (err) {
            statusText.textContent = err.message || 'status error';
            submitBtn.disabled = false;
        }
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        statusText.textContent = 'Uploading…';
        downloadLink.hidden = true;

        try {
            const res = await fetch('/api/process', { method: 'POST', body: new FormData(form) });
            const data = await res.json();
            if (!res.ok) {
                statusText.textContent = data.error || 'error';
                submitBtn.disabled = false;
                return;
            }
            renderJob(data);
            poll(data.id);
        } catch (err) {
            statusText.textContent = err.message || 'network error';
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
